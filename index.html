<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebXR Exhibit</title>
<style>
  :root { --gold: #d4af6a; --ink: #f4ecdc; --dim: #c2b59e; --green: #5fbf7a; --panel: rgba(22,19,16,0.94); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1b1814; color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden; }
  #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .box { background: var(--panel); border: 2px solid var(--gold); border-radius: 18px; }
  #overlay { position: fixed; left: 16px; top: 16px; width: min(430px, calc(100% - 32px)); padding: 20px 22px;
    max-height: calc(100% - 96px); overflow: auto; }   /* stops above the dot list at the bottom */
  .kit { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
  #overlay h1 { margin: 0 0 6px; font-size: 27px; }
  #subtitle { margin: 0 0 14px; color: var(--dim); font-size: 16px; line-height: 1.4; }
  .btns { display: flex; flex-direction: column; gap: 10px; }
  button, select { font: inherit; font-weight: 700; font-size: 18px; padding: 13px 18px; border-radius: 999px;
    border: 2px solid var(--gold); background: rgba(212,175,106,0.16); color: var(--ink); cursor: pointer; }
  select { border-radius: 12px; width: 100%; margin-bottom: 12px; background: #2a241d; }
  button.primary { background: var(--gold); color: #1a1612; }
  a.btnlink { display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 700; font-size: 18px;
    padding: 13px 18px; border-radius: 999px; border: 2px solid var(--gold); background: var(--gold); color: #1a1612; }
  a.btnlink img { width: 1px; height: 1px; }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button:not(:disabled):hover { filter: brightness(1.12); }
  #settings { margin-top: 16px; display: grid; gap: 10px; }
  .row { display: grid; gap: 6px; }
  .row > span { font-size: 13px; font-weight: 800; letter-spacing: 0.06em; color: var(--gold); text-transform: uppercase; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; font-size: 15px; padding: 9px 10px; }
  .seg button.sel { background: var(--gold); color: #1a1612; }
  #status { margin-top: 12px; font-size: 14px; color: var(--dim); min-height: 1.2em; }
  #help { position: fixed; left: 16px; bottom: 16px; font-size: 13px; color: var(--dim);
    background: rgba(22,19,16,0.75); padding: 8px 12px; border-radius: 10px; }
  #tracker { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; display: flex; gap: 6px; align-items: center;
    padding: 8px 14px; font-weight: 800; }
  #tracker span { margin-right: 6px; }
  #tracker button { width: 30px; height: 30px; padding: 0; border-radius: 50%; display: grid; place-items: center; font-size: 13px;
    border: 2px solid var(--gold); color: var(--ink); background: rgba(212,175,106,0.12); }
  #tracker button.on { background: var(--green); border-color: var(--green); color: #10200f; }
  #tracker button.cur { outline: 3px solid #fff3d6; outline-offset: 1px; }
  #tracker button:disabled { opacity: 0.35; border-style: dashed; }
  button:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid #fff3d6; outline-offset: 2px; }
  #acc-row .seg { flex-wrap: wrap; } #acc-row .seg button { font-size: 14px; padding: 9px 6px; flex: 1 1 40%; }
  #btn-text { margin-top: 12px; width: 100%; font-size: 15px; padding: 9px 12px; background: none; }
  #textview { position: fixed; inset: 0; z-index: 40; background: rgba(10,9,8,0.96); overflow: auto; padding: 24px 16px 60px; }
  #textview .inner { max-width: 760px; margin: 0 auto; }
  #textview header { display: flex; gap: 12px; align-items: center; justify-content: space-between; position: sticky; top: -24px; background: #0f0d0b; padding: 12px 0; }
  #textview h1 { font-size: 24px; margin: 0; }
  #textview article { border-top: 1px solid #4a3f33; padding: 14px 0; }
  #textview h2 { color: var(--gold); font-size: 21px; margin: 0 0 8px; }
  #textview p { line-height: 1.6; font-size: 18px; margin: 0 0 10px; }
  #textview dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 17px; margin: 0 0 10px; }
  #textview dt { font-weight: 800; color: var(--gold); } #textview dd { margin: 0; }
  #textview .credit { font-size: 14px; color: var(--dim); }
  /* Bigger text (Supports) */
  body.big-text #card { width: min(600px, calc(100% - 32px)); }
  body.big-text #card h2 { font-size: 31px; } body.big-text #card p { font-size: 22px; } body.big-text #card dl { font-size: 20px; }
  body.big-text #card nav button { font-size: 19px; padding: 13px 14px; } body.big-text .label { font-size: 15px; }
  body.big-text #overlay { width: min(520px, calc(100% - 32px)); font-size: 19px; } body.big-text #overlay h1 { font-size: 33px; }
  body.big-text #subtitle { font-size: 19px; } body.big-text #clue-text { font-size: 23px; }
  body.big-text #textview p { font-size: 23px; } body.big-text #textview h2 { font-size: 27px; } body.big-text #textview dl { font-size: 21px; }
  body.big-text #tracker button { width: 40px; height: 40px; font-size: 17px; }
  /* Calm mode: nothing slides or fades */
  body.calm *, body.calm *::before, body.calm *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  #clue { position: fixed; left: 50%; transform: translateX(-50%); bottom: 72px; width: min(560px, calc(100% - 32px));
    display: flex; gap: 14px; align-items: center; padding: 12px 16px; }
  #clue > div { flex: 1; } #clue-text { font-weight: 700; font-size: 18px; } #clue-help { font-size: 13px; color: var(--dim); margin-top: 2px; }
  #clue .label { margin: 0 0 2px; }
  #headset-row { margin-top: 16px; } #headset-row.ask { padding: 10px; border-radius: 12px; outline: 2px dashed var(--gold); }
  #headset-seg { display: grid; gap: 8px; } #headset-seg button { padding: 9px 0; }
  .hs-group > span { display: block; font-size: 12px; color: var(--dim); margin-bottom: 3px; } .note { font-size: 13px; color: var(--dim); line-height: 1.4; }
  #room-status { margin-top: 6px; font-size: 13px; color: var(--green); }
  #freeze { position: fixed; inset: 0; z-index: 50; background: rgba(10,9,8,0.92); display: grid; place-items: center; padding: 16px; }
  #freeze .box { padding: 32px 36px; max-width: 640px; text-align: center; }
  #freeze-text { font-size: 34px; font-weight: 800; line-height: 1.25; }
  #freeze .label { font-size: 15px; margin-bottom: 10px; }
  #card { position: fixed; right: 16px; top: 16px; width: min(460px, calc(100% - 32px));
    max-height: calc(100% - 32px); overflow: auto; padding: 22px 24px; }
  #card header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  #card-num { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--gold); color: #1a1612;
    display: grid; place-items: center; font-weight: 800; font-size: 22px; }
  #card-num.found { background: var(--green); }
  #card h2 { margin: 0; font-size: 24px; }
  #card p { line-height: 1.5; margin: 0 0 12px; font-size: 17px; }
  #card dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 12px; font-size: 16px; }
  #card dt { font-weight: 800; color: var(--gold); } #card dd { margin: 0; }
  .label { font-size: 12px; font-weight: 800; letter-spacing: 0.12em; color: var(--gold); margin: 6px 0 4px; }
  #card-law { border-left: 5px solid var(--gold); padding-left: 14px; margin-bottom: 12px; }
  #card-plain { color: #f6e2b4; font-weight: 500; }
  #card-extra img { width: 100%; border-radius: 12px; margin-bottom: 12px; display: block; }
  #card-orig-text { font-family: Georgia, "Times New Roman", serif; font-style: italic; color: #e7d3a6; margin-bottom: 4px !important; }
  #card-orig-src, #card-credit { font-size: 13px !important; color: var(--dim); }
  #card-think { font-weight: 700; }
  #card nav { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  #card nav button { flex: 1 1 auto; font-size: 15px; padding: 10px 12px; }
  [hidden] { display: none !important; }
  @media (max-width: 760px) {
    #card { top: auto; bottom: 16px; max-height: 60%; }
    #tracker { bottom: auto; top: 16px; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
  <div id="app"></div>

  <section id="overlay" class="box">
    <div id="kit-label" class="kit" hidden></div>
    <h1 id="title">…</h1>
    <p id="subtitle"></p>
    <select id="exhibit-pick" hidden aria-label="Exhibit"></select>
    <div class="btns">
      <!-- iPad / iPhone: Apple AR Quick Look (needs rel="ar" and an <img> as the first child) -->
      <a id="btn-ql" rel="ar" class="btnlink" hidden><img alt="" width="1" height="1" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="><span id="btn-ql-label"></span></a>
      <button id="btn-ar" class="primary" disabled>…</button>
      <button id="btn-vr" disabled>…</button>
    </div>
    <div id="settings">
      <div class="row"><span id="lbl-lang"></span><div class="seg"><button data-set="lang:en"></button><button data-set="lang:es"></button></div></div>
      <div class="row"><span id="lbl-hunt"></span><div class="seg"><button data-set="hunt:on"></button><button data-set="hunt:off"></button></div></div>
      <div class="row"><span id="lbl-clues"></span><div class="seg"><button data-set="clues:on"></button><button data-set="clues:off"></button></div></div>
      <div class="row"><span id="lbl-mode"></span><div class="seg"><button data-set="mode:walk"></button><button data-set="mode:seated"></button></div></div>
    </div>
    <div class="row" id="acc-row" style="margin-top:10px"><span id="lbl-acc"></span><div class="seg"><button data-acc="big" aria-pressed="false"></button><button data-acc="read" aria-pressed="false"></button><button data-acc="calm" aria-pressed="false"></button><button data-acc="auto" aria-pressed="false"></button></div><div id="acc-help" class="note"></div></div>
    <button id="btn-text"></button>
    <div id="headset-row" class="row" hidden><span id="lbl-headset"></span><div id="headset-seg"></div><div id="headset-help" class="note"></div></div>
    <div id="status"></div>
    <div id="room-status" hidden></div>
    <pre id="debug" hidden style="white-space:pre-wrap;font-size:11px;color:#9ff59f;background:#0b0b0b;padding:8px;border-radius:8px;margin:10px 0 0"></pre>
  </section>

  <div id="help"></div>
  <nav id="tracker" class="box" hidden></nav>
  <div id="clue" class="box" hidden>
    <div><div class="label" id="clue-label"></div><div id="clue-text"></div><div id="clue-help"></div></div>
    <button id="clue-hint" class="primary"></button>
  </div>

  <div id="freeze" hidden><div class="box"><div id="freeze-from" class="label"></div><div id="freeze-text"></div></div></div>

  <aside id="card" class="box" hidden role="dialog" aria-labelledby="card-title">
    <header><div id="card-num" aria-hidden="true">1</div><h2 id="card-title" tabindex="-1"></h2></header>
    <p id="card-body"></p>
    <dl id="card-facts" hidden></dl>
    <div id="card-law" hidden><div class="label" id="card-plain-label"></div><p id="card-plain"></p></div>
    <div id="card-extra" hidden></div>
    <div id="card-more" hidden>
      <p id="card-more-text"></p>
      <div id="card-orig"><div class="label" id="card-orig-label"></div><p id="card-orig-text"></p><p id="card-orig-src"></p></div>
      <p id="card-credit"></p>
    </div>
    <div class="label" id="card-think-label"></div>
    <p id="card-think"></p>
    <nav>
      <button id="card-prev"></button><button id="card-listen" class="primary" hidden></button><button id="card-read" class="primary" hidden></button>
      <button id="card-showme" class="primary" hidden></button><button id="card-moreBtn"></button><button id="card-close" class="primary"></button><button id="card-next"></button><button id="card-nextstop" class="primary" hidden></button>
    </nav>
  </aside>

  <div id="textview" hidden role="dialog" aria-modal="true" aria-labelledby="tv-title"><div class="inner">
    <header><h1 id="tv-title"></h1><div><button id="tv-read" class="primary" hidden></button> <button id="tv-close" class="primary"></button></div></header>
    <div id="tv-body"></div>
  </div></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
