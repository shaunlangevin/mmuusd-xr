<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMUUSD Labs: Cannon Recoil Lab</title>
<style>
  :root { --gold: #d4af6a; --ink: #f4ecdc; --dim: #c2b59e; --panel: rgba(22,19,16,0.94); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #24211d; color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden; }
  #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .box { background: var(--panel); border: 2px solid var(--gold); border-radius: 18px; }
  #start { position: fixed; left: 16px; top: 16px; width: min(440px, calc(100% - 32px)); padding: 20px 22px; max-height: calc(100% - 32px); overflow: auto; z-index: 5; }
  #kicker { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
  h1 { margin: 0 0 6px; font-size: 27px; }
  #intro { margin: 0 0 14px; color: var(--dim); font-size: 16px; line-height: 1.4; }
  .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  button { font: inherit; font-weight: 700; font-size: 18px; padding: 13px 18px; border-radius: 999px;
    border: 2px solid var(--gold); background: rgba(212,175,106,0.16); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--gold); color: #1a1612; }
  button:hover { filter: brightness(1.12); }
  button:focus-visible { outline: 3px solid #fff3d6; outline-offset: 2px; }
  .row { display: grid; gap: 6px; margin-top: 12px; }
  .row > span { font-size: 13px; font-weight: 800; letter-spacing: 0.06em; color: var(--gold); text-transform: uppercase; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { flex: 1; font-size: 15px; padding: 9px 10px; }
  .seg button.sel { background: var(--gold); color: #1a1612; }
  .note { font-size: 13px; color: var(--dim); line-height: 1.4; margin-top: 4px; }
  #status { margin-top: 10px; font-size: 14px; color: var(--dim); min-height: 1.2em; }
  #menu { position: fixed; left: 16px; top: 16px; z-index: 5; font-size: 15px; padding: 9px 14px; background: var(--panel); }
  [hidden] { display: none !important; }
  #freeze { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: rgba(20,17,14,0.82); }
  #freeze .box { padding: 28px 34px; max-width: min(640px, calc(100% - 32px)); text-align: center; }
  #freeze-from { font-size: 14px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
  #freeze-text { font-size: 30px; font-weight: 800; line-height: 1.25; }
  #hs-seg button { flex: 0 0 auto; min-width: 46px; }
  .small { font-size: 12px; color: var(--dim); line-height: 1.4; margin-top: 12px; }
  body.big-text #start { width: min(540px, calc(100% - 32px)); font-size: 19px; }
  body.big-text h1 { font-size: 33px; } body.big-text #intro { font-size: 19px; } body.big-text .note, body.big-text .small { font-size: 16px; }
</style>
</head>
<body>
<div id="app"></div>
<button id="menu" hidden>☰</button>
<div id="freeze" hidden><div class="box"><div id="freeze-from"></div><div id="freeze-text"></div></div></div>
<div id="start" class="box">
  <div id="kicker">Grade 6 · Forces and Motion</div>
  <h1 id="title">Cannon Recoil Lab</h1>
  <p id="intro"></p>
  <div class="row"><span id="l-lang">Language</span>
    <div class="seg"><button data-lang="en">English</button><button data-lang="es">Español</button></div></div>
  <div class="row" id="size-row"><span id="l-size">Size</span><div class="seg" id="size-seg"></div><div class="note" id="size-note"></div></div>
  <div class="row"><span id="l-acc">Supports</span><div class="seg" id="acc-seg"></div></div>
  <div class="row" id="hs-row" hidden><span id="l-hs">Headset</span><div class="note" id="hs-now"></div><div class="seg" id="hs-seg"></div><div class="note" id="hs-note"></div></div>
  <div class="btns">
    <button id="btn-ar" class="primary" hidden>Start in the headset</button>
    <button id="btn-vr" class="primary" hidden>Start in VR</button>
    <div class="note" id="noxr" hidden></div>
    <button id="btn-preview">Preview on this screen</button>
  </div>
  <div id="status"></div>
  <div class="small" id="privacy"></div>
  <div class="small" id="credit"></div>
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
